[project]
name = "classroom-deadline-assistant"
version = "0.1.0"
description = "Deadline radar, requirement digest, scaffold, and manual-submit assistant for Google Classroom."
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "cryptography>=42",
  "fastapi>=0.110",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
ocr = [
  "pytesseract>=0.3",
  "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
